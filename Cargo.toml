[package]
name = "forge"
version = "0.2.0"
edition = "2021"
description = "A session-aware GTK4 terminal with structured command blocks"
repository = "https://github.com/beamiter/forge"
readme = "README.md"
license = "MIT OR Apache-2.0"
publish = false
categories = ["command-line-utilities", "development-tools"]
autobins = false

[[bin]]
name = "forge"
path = "src/bin/forge.rs"
test = false
bench = false

[dependencies]
# Pin the shared contract so a branch move cannot silently change a release build.
jterm_core = { version = "0.2.0", git = "https://github.com/beamiter/jterm_core.git", rev = "74475209c7f18be73782607caa0ec58e5b5bc70f" }
jagent = { version = "0.7.0", git = "https://github.com/beamiter/jagent.git", rev = "6ed0b9f037eff9359d62ed448e0d117327fabe26" }
log = { version = "0.4", features = ["std"] }
crossbeam-channel = "0.5"
dirs = "6.0"
memchr = "2"
nix = { version = "0.31.3", features = ["term", "signal", "process", "ioctl"] }
pcre2-sys = "0.2.10"
toml = "1.1.2"
vte4 = { version = "0.10.0", features = ["v0_76"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Native Codex agent tasks: wire protocol, containment, and identity.
libc = "0.2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
rkyv = { version = "0.8", features = ["bytecheck"] }
zstd = "0.13"
regex = "1"
regex-syntax = "0.8"
fuzzy-matcher = "0.3"
unicode-width = "0.2"
gtk4 = { version = "0.11.4", features = ["v4_14"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }

[dev-dependencies]
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
